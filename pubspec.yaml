name: techloop_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: any # pinned by flutter_localizations
  local_auth: ^2.3.0
  path_provider: ^2.1.5 # offline cache + queue (already pulled in by other plugins)
  pdf: ^3.12.0
  printing: ^5.14.3
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png
    - assets/icon/logo-tech.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/icon/logo.png"
